<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account | Findly AI</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="brand">
      <svg class="pin" viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><path d="M12 6.5l3 1.7v3.6l-3 1.7-3-1.7V8.2z" class="cube"/></svg>
      <div><h1>Findly AI</h1><p>An Intelligent Lost and Found<br>Matching System</p></div>
    </div>
    <div class="pitch">
      <h2>Lost something?<br>Found something?</h2>
      <p>Let AI help you match, reunite, and return belongings to their rightful owners on campus.</p>
    </div>
  </section>

  <section class="panel">
    <form class="box" id="regForm" novalidate>
      <svg class="boxicon" viewBox="0 0 32 32"><path d="M4 14l10-5 10 5v10l-10 5-10-5zM4 14l10 5 10-5M14 19v10M22 4l-2 4M27 7l-4 2M17 2v4"/></svg>
      <h2>Create Account</h2>
      <p class="sub">Join Findly AI to report and find items</p>
      <label class="field"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8"/></svg><input id="name" type="text" placeholder="Full Name" autocomplete="name" required></label><label class="field"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h4M7 14h6"/></svg><input id="sid" type="text" placeholder="Student ID" required></label><label class="field"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input id="email" type="email" placeholder="Email" autocomplete="email" required></label><label class="field"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><input id="pass" type="password" placeholder="Password (min. 8 characters)" autocomplete="new-password" required><button type="button" class="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label><label class="field"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><input id="pass2" type="password" placeholder="Confirm Password" autocomplete="new-password" required><button type="button" class="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
      <p class="err" id="err" hidden></p>
      <button class="btn" type="submit">Create Account</button>
      <p class="alt">Already have an account? <a href="login.html">Log In</a></p>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/register.js"></script>
</body>
</html>
